services:
  - type: web
    name: sorour-mohamed-portfolio
    runtime: python
    buildCommand: ""
    startCommand: python3 server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: ./data/portfolio.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
